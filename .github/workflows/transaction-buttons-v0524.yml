name: BudgetFlow v0.5.2.4 transaction buttons
on:
  push:
    paths:
      - '.github/workflows/transaction-buttons-v0524.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI
        run: |
          python - <<'PY'
          import base64
          exec(base64.b64decode(" xKS5yZXBsYWNlKCcseCknLCcsMSknKQpwLndyaXRlX3RleHQocyxlbmNvZGluZz0ndXRmLTgnKQo=".replace(" ","")).decode())
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          Path('/tmp/budgetflow.js').write_text('\n'.join(re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/budgetflow.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "BudgetFlow v0.5.2.4 transaction type buttons"
          git push
