name: BudgetFlow v0.5.2.3 auto resume sync

on:
  push:
    paths:
      - '.github/workflows/auto-resume-v0523.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch auto resume
        run: python tools/patch_v0523.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          js='\n'.join(re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S))
          Path('/tmp/budgetflow.js').write_text(js)
          PY
          node --check /tmp/budgetflow.js
      - name: Commit v0.5.2.3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "BudgetFlow v0.5.2.3 auto resume Google Drive"
          git push
# rerun after patch script update
