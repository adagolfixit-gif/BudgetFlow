name: BudgetFlow vault compatibility hotfix 2

on:
  push:
    paths:
      - '.github/workflows/vault-compat-hotfix2.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch vault compatibility
        shell: python
        run: |
          from pathlib import Path
          import re, base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          crypto_new=base64.b64decode('').decode()
          unlock_new=base64.b64decode('').decode()
          s,n=re.subn(r'async function deriveKey\(p,s\)\{.*?async function saveLocal\(',crypto_new+'async function saveLocal(',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('crypto patch failed')
          s,n=re.subn(r'\$\("unlockBtn"\)\.onclick=async\(\)=>\{.*?\};\nfunction bindEnterLogin',unlock_new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('unlock patch failed')
          s=s.replace('content="0.5.2"','content="0.5.2.1"',1).replace('UI Tiles · v0.5.2','UI Tiles · v0.5.2.1',1)
          p.write_text(s,encoding='utf-8')
      - name: Validate JavaScript
        run: |
          python -c "from pathlib import Path; import re; s=Path('index.html').read_text(); Path('/tmp/budgetflow.js').write_text('\\n'.join(re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)))"
          node --check /tmp/budgetflow.js
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore BudgetFlow vault compatibility"
          git push
