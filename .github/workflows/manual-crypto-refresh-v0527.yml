# trigger 2026-08-20
name: BudgetFlow v0.5.2.7 manual crypto refresh
on:
  push:
    paths:
      - '.github/workflows/manual-crypto-refresh-v0527.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch BudgetFlow
        run: |
          python - <<'PY'
          import base64
          exec(base64.b64decode("").decode("utf-8"))
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/budgetflow.js').write_text('\n'.join(re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)),encoding='utf-8')
          PY
          node --check /tmp/budgetflow.js
      - name: Commit production update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "BudgetFlow v0.5.2.7 manual crypto refresh"
          git push
